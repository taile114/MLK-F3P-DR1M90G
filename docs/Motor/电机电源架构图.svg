<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="1300" viewBox="0 0 2340 1300">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141414"/>
    </marker>
    <style>
      .box  { fill:#EFEFFA; stroke:#8E8ECF; stroke-width:1.6; }
      .gbox { fill:#EFF7EF; stroke:#7FAF8A; stroke-width:1.6; }
      .kbox { fill:#FFF4EF; stroke:#D89A7A; stroke-width:1.6; }
      .nbox { fill:#F3EEFB; stroke:#9B7FD4; stroke-width:1.8; }
      .sbox { fill:#EFF9F7; stroke:#5FA9A0; stroke-width:1.8; }
      .rbox { fill:#FDF2F2; stroke:#D98A8A; stroke-width:1.6; }
      .ttl  { font-family:"Noto Sans CJK SC","Arial","Microsoft YaHei",sans-serif; font-size:17px; font-weight:bold; fill:#141414; }
      .sub  { font-family:"Noto Sans CJK SC","Arial","Microsoft YaHei",sans-serif; font-size:13px; fill:#4A4A70; }
      .ln   { stroke:#141414; stroke-width:1.6; fill:none; marker-end:url(#arw); }
      .wire { stroke:#141414; stroke-width:1.6; fill:none; }
      .net  { font-family:"Noto Sans CJK SC","Arial","Microsoft YaHei",sans-serif; font-size:12px; fill:#B03A2E; }
      .title{ font-family:"Noto Sans CJK SC","Arial","Microsoft YaHei",sans-serif; font-size:26px; font-weight:bold; fill:#141414; }
      .note { font-family:"Noto Sans CJK SC","Arial","Microsoft YaHei",sans-serif; font-size:13px; fill:#555; }
    </style>
