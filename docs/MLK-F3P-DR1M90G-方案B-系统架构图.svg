  <rect width="2000" height="1170" fill="#FFFFFF"/>
  <text x="70" y="74" font-size="34" fill="#12325B" font-weight="bold" text-anchor="start">方案 B 系统架构：核心板 + 传感器载板 + 市售电机整套</text>
  <text x="70" y="122" font-size="24" fill="#5A6472" font-weight="normal" text-anchor="start">传感器载板与核心板经 P1.2 单点共地；电机整套独立运行，不与核心板共地、不通信</text>
  <path d="M 350,334 L 350,412" fill="none" stroke="#5A6472" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-g)"/>
  <path d="M 600,560 L 900,560" fill="none" stroke="#12325B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-b)"/>
  <path d="M 900,560 L 600,560" fill="none" stroke="#12325B" stroke-width="3.5" marker-end="url(#ah-b)" stroke-linecap="round"/>
  <path d="M 1560,396 L 1640,386" fill="none" stroke="#1F7A8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-t)"/>
  <path d="M 1560,646 L 1640,646" fill="none" stroke="#1F7A8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-t)"/>
  <path d="M 350,722 L 350,828 L 900,828 L 900,880" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-n)"/>
